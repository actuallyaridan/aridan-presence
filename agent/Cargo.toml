# The Tauri app: the window and tray on Windows and macOS. The work itself
# is in core/; the Linux app, which uses Qt instead, is in qt/.

[workspace]
members = ["core", "qt"]

[package]
name = "aridan-presence"
version = "0.3.0"
edition = "2024"

[dependencies]
presence-core = { path = "core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"
tauri = { version = "2.12.1", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.2"
tokio = { version = "1.53.2", features = ["rt", "signal"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["UI", "UI_ViewManagement"] }

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

# The finished build: debugging information left out, and the whole program
# optimised together, which makes it a good deal smaller.
[profile.release]
strip = true
lto = true
codegen-units = 1
