# Everything that does the actual work: reading Cider, Discord and Now
# Playing, looking up covers, and reporting to presence.aridan.net. Both
# windows use it - the Tauri one on Windows and macOS (../src) and the Qt one
# on Linux (../qt) - and neither has any of this in it themselves.

[package]
name = "presence-core"
version = "0.3.0"
edition = "2024"

[dependencies]
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"
tokio = { version = "1.53.2", features = ["rt", "macros", "time", "net", "signal", "sync", "io-util"] }
toml = "1.1.6"

# HTTPS: on Linux, rustls, which brings its own crypto. On Windows and macOS,
# the TLS the OS already has (SChannel, and Apple's Security framework),
# which leaves nothing to compile in C and makes the app smaller.
[target.'cfg(target_os = "linux")'.dependencies.reqwest]
version = "0.13.5"
default-features = false
features = ["json", "query", "rustls"]

[target.'cfg(not(target_os = "linux"))'.dependencies.reqwest]
version = "0.13.5"
default-features = false
features = ["json", "query", "native-tls"]

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Media_Control", "Foundation", "Foundation_Collections", "Win32_System_Com"] }
